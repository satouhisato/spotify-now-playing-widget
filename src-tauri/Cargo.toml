[package]
name="spotify-now-playing-widget"
version="0.8.12"
edition="2021"
[lib]
name="spotify_now_playing_widget_lib"
crate-type= ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build= {version="2",features= [] }
[dependencies]
tauri= {version="2",features= [] }
serde= {version="1",features= ["derive"] }
serde_json="1"
base64="0.22"
windows = { version = "0.61.3", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Graphics_DirectWrite", "Win32_System_WinRT"] }
